<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>NI MBAYA</title>
    <link rel="preload" as="image" href="/src/assets/intro/sababisha-africa-logo.svg" type="image/svg+xml" fetchpriority="high" />
    <style>
      #brand-intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, #fff 0, #fbf7ed 42%, #eee2ca 100%);
        transition: opacity 150ms ease, visibility 150ms ease;
      }
      #brand-intro.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .brand-intro__loading {
        position: absolute;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        color: #6a3d22;
        font: 700 12px/1 system-ui, sans-serif;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .brand-intro__activity {
        position: absolute;
        left: 50%;
        bottom: 64px;
        width: min(260px, 65vw);
        height: 5px;
        transform: translateX(-50%);
        border-radius: 5px;
        overflow: hidden;
        background: #6a3d2218;
      }
      .brand-intro__activity::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 -40%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #c47c36, transparent);
        animation: intro-loading-travel 1.25s ease-in-out infinite;
      }
      @keyframes intro-loading-travel { to { transform: translateX(350%); } }
      .brand-intro__logo {
        width: min(76vw, 880px);
        height: auto;
        opacity: 0;
        transform: scale(.96);
        mix-blend-mode: multiply;
        animation: brand-logo-reveal 850ms 180ms cubic-bezier(.2, .8, .2, 1) forwards;
      }
      .brand-intro__skip {
        position: absolute;
        right: 22px;
        bottom: 18px;
        border: 0;
        padding: 8px 12px;
        color: #6a3d22;
        background: transparent;
        font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: .65;
      }
      @keyframes brand-logo-reveal {
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-intro__logo { animation-duration: 250ms; }
        .brand-intro__activity::after { animation: none; left: 30%; }
      }
      #portrait-guard {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
        place-items: center;
        padding: 28px;
        box-sizing: border-box;
        color: #f5f7fb;
        background: radial-gradient(circle at 50% 38%, #182d47 0, #07111f 48%, #020508 100%);
        text-align: center;
        font-family: Arial, sans-serif;
      }
      .portrait-guard__card {
        max-width: 310px;
        border: 2px solid #ffc51d;
        border-radius: 16px;
        padding: 30px 24px;
        background: rgba(4, 9, 16, .92);
        box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
      }
      .portrait-guard__icon { font: 700 48px/1 Arial, sans-serif; color: #ffc51d; }
      .portrait-guard__title { margin: 14px 0 10px; font: italic 800 27px/1.08 Impact, Arial Black, sans-serif; letter-spacing: .04em; }
      .portrait-guard__copy { margin: 0; color: #dce6f4; font-size: 16px; line-height: 1.45; }
      .portrait-guard__hint { display: block; margin-top: 20px; color: #ffc51d; font: 800 12px/1.3 Arial, sans-serif; letter-spacing: .13em; }
      @media (orientation: portrait) and (max-width: 820px) {
        #portrait-guard { display: grid; }
        #brand-intro, #game { visibility: hidden; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <div id="portrait-guard" role="status" aria-live="polite">
      <div class="portrait-guard__card">
        <div class="portrait-guard__icon">↻</div>
        <h1 class="portrait-guard__title">PLAY IN LANDSCAPE</h1>
        <p class="portrait-guard__copy">NI MBAYA is built for a wide fighting arena. Turn your device sideways for the full experience.</p>
        <span class="portrait-guard__hint">ROTATE YOUR DEVICE</span>
      </div>
    </div>
    <div id="brand-intro" data-started-at="0" role="status" aria-label="Sababisha Africa presents NI MBAYA">
      <img class="brand-intro__logo" src="/src/assets/intro/sababisha-africa-logo.svg" alt="Sababisha Africa" width="1699" height="926" loading="eager" fetchpriority="high" decoding="sync" />
      <div class="brand-intro__activity" aria-hidden="true"></div>
      <div class="brand-intro__loading" aria-live="polite">Downloading game engine…</div>
      <button class="brand-intro__skip" type="button">Skip intro</button>
    </div>
    <div id="game"></div>
    <script>
      const intro = document.getElementById('brand-intro');
      intro.dataset.startedAt = String(Date.now());
      intro.querySelector('.brand-intro__skip').addEventListener('click', () => {
        intro.dataset.skipped = 'true';
        window.dispatchEvent(new Event('brand-intro-skip'));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
